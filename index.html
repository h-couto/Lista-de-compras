                </div>
                <h1 class="text-xl font-semibold tracking-tight text-slate-900">Helder e Diana</h1>
            </header>

            <!-- Minimal Form Input -->
            <section class="px-6 py-2">
                <form id="add-item-form" class="flex items-center gap-2 bg-slate-50 border border-slate-200/80 rounded-2xl p-1.5 focus-within:border-slate-900 focus-within:ring-1 focus-within:ring-slate-900 transition-all duration-200">

                        class="flex-1 px-3 py-2 text-sm bg-transparent border-none focus:outline-none text-slate-900 placeholder:text-slate-400 font-normal">
                    
                    <input type="text" id="qty-input" placeholder="Qtd." 
                        class="w-16 px-2 py-2 text-sm bg-transparent border-none focus:outline-none text-slate-600 placeholder:text-slate-400 text-center font-normal">
                    
                    <button type="submit" 
                        class="w-9 h-9 bg-slate-900 hover:bg-slate-800 text-white rounded-xl shadow-xs transition-all flex items-center justify-center active:scale-95 flex-shrink-0">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </form>
            </section>

            <!-- Filters -->
            <section class="px-6 pt-4 pb-2 flex items-center justify-between">
                <div class="flex items-center gap-4 text-xs">
                    <button id="filter-all" onclick="setFilter('all')" class="font-medium text-slate-900 border-b-2 border-slate-900 pb-0.5 transition">Todos</button>
                    <button id="filter-pending" onclick="setFilter('pending')" class="font-normal text-slate-400 hover:text-slate-700 pb-0.5 transition">Pendentes</button>
                    <button id="filter-completed" onclick="setFilter('completed')" class="font-normal text-slate-400 hover:text-slate-700 pb-0.5 transition">Comprados</button>
                </div>

                <button onclick="confirmClearCompleted()" class="text-xs text-slate-400 hover:text-rose-500 font-normal transition">
                    Limpar
                </button>
            </section>

            <!-- Shopping List -->
            <main class="px-6 py-3 max-h-[50vh] overflow-y-auto custom-scrollbar">
                <ul id="shopping-list" class="space-y-1">
                    <!-- Data loaded dynamically -->
                </ul>

                <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center text-slate-400">
                    <p class="text-xs font-normal text-slate-400">Nenhum item adicionado</p>
                </div>
            </main>
        </div>
