<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lista de compras de Helder e Diana</title>
    
    <!-- PWA & Mobile Fullscreen Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Compras H&D">
    <meta name="theme-color" content="#4f46e5">

    <!-- Web App Manifest com Ícone PNG Dinâmico -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" id="favicon-dynamic">
    <link rel="apple-touch-icon" id="apple-icon-dynamic">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-start sm:justify-center p-0 sm:p-3">

    <div class="w-full max-w-lg min-h-screen sm:min-h-0 bg-white sm:rounded-2xl shadow-xl flex flex-col overflow-hidden">
        
        <!-- Header Ultra-Compacto -->
        <header class="bg-indigo-600 text-white px-4 py-3 shadow-sm">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center font-bold text-sm border border-white/20 shadow-inner">
                        <i class="fa-solid fa-basket-shopping text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold leading-tight">Helder e Diana</h1>
                        <span class="text-[10px] uppercase tracking-wider text-indigo-200 font-semibold block leading-none">Lista Partilhada</span>
                    </div>
                </div>
                <div class="text-right">
                    <span id="counter-text" class="text-xs font-medium text-indigo-100">0 comprados</span>
                </div>
            </div>

            <!-- Progresso Fino -->
            <div class="mt-2 w-full bg-white/20 rounded-full h-1.5 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-400 h-1.5 w-0 transition-all duration-300"></div>
            </div>
        </header>

        <!-- Formulário Otimizado -->
        <div class="p-2.5 bg-slate-50 border-b border-slate-200">
            <div class="flex gap-1.5 items-stretch">
                <input type="text" id="item-input" placeholder="O que falta comprar..." 
                    class="flex-1 min-w-0 px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
                
                <input type="text" id="qty-input" placeholder="Qtd." 
                    class="w-16 px-2 py-2 text-sm bg-white border border-slate-300 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs">
                
                <button type="button" id="add-btn" 
                    class="px-3.5 bg-indigo-600 active:bg-indigo-700 text-white rounded-lg flex items-center justify-center font-bold text-base shadow-xs cursor-pointer shrink-0">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Filtros e Ações Compactos -->
        <div class="px-3 py-1.5 bg-white border-b border-slate-100 flex items-center justify-between text-xs">
            <div class="flex space-x-1 bg-slate-100 p-0.5 rounded-lg">
                <button type="button" onclick="setFilter('all')" id="btn-all" class="px-2.5 py-1 rounded-md font-bold text-indigo-700 bg-white shadow-xs">Todos</button>
                <button type="button" onclick="setFilter('pending')" id="btn-pending" class="px-2.5 py-1 rounded-md font-medium text-slate-500">Falta</button>
                <button type="button" onclick="setFilter('completed')" id="btn-completed" class="px-2.5 py-1 rounded-md font-medium text-slate-500">Feito</button>
            </div>
            
            <button type="button" onclick="clearCompleted()" class="text-[11px] text-rose-500 font-semibold px-2 py-1 hover:bg-rose-50 rounded-md">
                Limpar Feitos
            </button>
        </div>

        <!-- Lista com Maior Área Visível -->
        <div class="flex-1 p-2.5 overflow-y-auto bg-slate-50/50" style="max-height: 68vh;">
            <ul id="list-container" class="space-y-1.5">
                <!-- Itens injetados via JS -->
            </ul>

            <div id="empty-msg" class="hidden text-center py-8 text-slate-400 text-xs font-medium">
                A lista está vazia. Adiciona um item em cima!
            </div>
        </div>
        
        <!-- Rodapé Minimalista -->
        <footer class="py-1.5 px-3 bg-white border-t border-slate-100 text-center text-[10px] text-slate-400">
            Helder e Diana • Sincronizado localmente
        </footer>
    </div>

    <!-- Script Principal -->
    <script>
        // Gerar Ícone PNG Proporcional via Canvas
        (function generateAppIcons() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const r = 110;
            ctx.fillStyle = '#4f46e5';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(512 - r, 0);
            ctx.quadraticCurveTo(512, 0, 512, r);
            ctx.lineTo(512, 512 - r);
            ctx.quadraticCurveTo(512, 512, 512 - r, 512);
            ctx.lineTo(r, 512);
            ctx.quadraticCurveTo(0, 512, 0, 512 - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 26;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(110, 150);
            ctx.lineTo(170, 150);
            ctx.lineTo(210, 330);
            ctx.lineTo(390, 330);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(190, 210);
            ctx.lineTo(410, 210);
            ctx.lineTo(380, 295);
            ctx.lineTo(210, 295);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(240, 385, 22, 0, Math.PI * 2);
            ctx.arc(360, 385, 22, 0, Math.PI * 2);
            ctx.fill();

            const iconDataUrl = canvas.toDataURL('image/png');

            document.getElementById('favicon-dynamic').href = iconDataUrl;
            document.getElementById('apple-icon-dynamic').href = iconDataUrl;

            const manifestObj = {
                "name": "Lista de compras de Helder e Diana",
                "short_name": "Compras H&D",
                "start_url": "./",
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": "#4f46e5",
                "icons": [{
                    "src": iconDataUrl,
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            document.getElementById('manifest-placeholder').href = URL.createObjectURL(manifestBlob);
        })();

        // Lógica da Lista
        let items = [];
        try {
            const stored = localStorage.getItem('hd_shopping_list');
            if (stored) {
                items = JSON.parse(stored);
            }
        } catch (e) {
            items = [];
        }

        let currentFilter = 'all';
        render();

        document.getElementById('add-btn').addEventListener('click', addItem);

        document.getElementById('item-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addItem();
        });
        document.getElementById('qty-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addItem();
        });

        function addItem() {
            const nameInput = document.getElementById('item-input');
            const qtyInput = document.getElementById('qty-input');
            
            const name = nameInput.value.trim();
            const qty = qtyInput.value.trim();

            if (!name) {
                nameInput.focus();
                return;
            }

            const newItem = {
                id: Date.now().toString(),
                name: name,
                qty: qty,
                completed: false
            };

            items.unshift(newItem);
            saveAndRender();

            nameInput.value = '';
            qtyInput.value = '';

            nameInput.blur();
            qtyInput.blur();
        }

        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveAndRender();
            }
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveAndRender();
        }

        function clearCompleted() {
            if (items.some(i => i.completed)) {
                if (confirm('Tens a certeza que queres remover os itens concluídos?')) {
                    items = items.filter(i => !i.completed);
                    saveAndRender();
                }
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'pending', 'completed'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filter) {
                    btn.className = "px-2.5 py-1 rounded-md font-bold text-indigo-700 bg-white shadow-xs";
                } else {
                    btn.className = "px-2.5 py-1 rounded-md font-medium text-slate-500";
                }
            });
            render();
        }

        function saveAndRender() {
            localStorage.setItem('hd_shopping_list', JSON.stringify(items));
            render();
        }

        function render() {
            const container = document.getElementById('list-container');
            const emptyMsg = document.getElementById('empty-msg');
            container.innerHTML = '';

            const filtered = items.filter(i => {
                if (currentFilter === 'pending') return !i.completed;
                if (currentFilter === 'completed') return i.completed;
                return true;
            });

            if (filtered.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');

                filtered.forEach(item => {
                    const li = document.createElement('li');
                    li.className = `flex items-center justify-between px-3 py-2 bg-white border rounded-xl shadow-xs transition ${
                        item.completed ? 'opacity-60 bg-slate-50' : 'border-slate-200'
                    }`;

                    li.innerHTML = `
                        <div class="flex items-center space-x-2.5 flex-1 min-w-0 pr-1.5">
                            <button onclick="toggleItem('${item.id}')" class="w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 ${
                                item.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                            }">
                                ${item.completed ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                            </button>
                            <span class="text-xs font-semibold truncate ${item.completed ? 'line-through text-slate-400 font-normal' : 'text-slate-800'}">
                                ${escapeHtml(item.name)}
                            </span>
                        </div>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            ${item.qty ? `<span class="text-[11px] px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-md font-bold">${escapeHtml(item.qty)}</span>` : ''}
                            <button onclick="deleteItem('${item.id}')" class="w-7 h-7 flex items-center justify-center text-slate-300 hover:text-rose-500">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(li);
                });
            }

            const total = items.length;
            const done = items.filter(i => i.completed).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('counter-text').innerText = `${done}/${total} comprados (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
