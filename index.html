<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de compras de Helder e Diana</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%236366f1'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='32' d='M160 288h249.44a8 8 0 007.85-6.43l28.8-144a8 8 0 00-7.85-9.57H128'/%3E%3Ccircle cx='176' cy='416' r='32' fill='%23ffffff'/%3E%3Ccircle cx='400' cy='416' r='32' fill='%23ffffff'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='32' d='M48 80h64l48 272h256'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%236366f1'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='32' d='M160 288h249.44a8 8 0 007.85-6.43l28.8-144a8 8 0 00-7.85-9.57H128'/%3E%3Ccircle cx='176' cy='416' r='32' fill='%23ffffff'/%3E%3Ccircle cx='400' cy='416' r='32' fill='%23ffffff'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='32' d='M48 80h64l48 272h256'/%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-start sm:justify-center antialiased selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-lg min-h-screen sm:min-h-0 bg-white sm:rounded-3xl shadow-xl sm:border sm:border-slate-100 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 text-white p-4 sm:p-6 shadow-md shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-white font-bold text-sm sm:text-base border border-white/20 shrink-0">
                    H&D
                </div>
                <div class="min-w-0 flex-1">
                    <span class="text-[10px] sm:text-xs uppercase tracking-wider text-indigo-100 font-semibold block">Lista de Compras</span>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white truncate">Helder e Diana</h1>
                </div>
            </div>

            <!-- Barra de Progresso -->
            <div class="mt-3 sm:mt-4 bg-black/15 rounded-xl p-2.5 backdrop-blur-md border border-white/10">
                <div class="flex justify-between text-xs px-1 mb-1 font-medium text-indigo-50">
                    <span id="progress-stats">0/0 comprados</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="w-full bg-indigo-950/30 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-2 rounded-full transition-all duration-300 ease-out w-0"></div>
                </div>
            </div>
        </header>

        <!-- Formulário Adicionar Item -->
        <section class="p-3 sm:p-4 bg-slate-50 border-b border-slate-100 shrink-0">
            <form id="add-item-form" class="flex gap-2 items-center">
                <input type="text" id="item-input" placeholder="Adicionar item..." required 
                    class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs font-medium">
                
                <input type="text" id="qty-input" placeholder="Qtd." 
                    class="w-16 sm:w-20 px-2 py-2.5 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs text-center font-medium shrink-0">
                
                <button type="submit" 
                    class="w-10 h-10 sm:w-11 sm:h-11 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl shadow-xs transition flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
            </form>
        </section>

        <!-- Barra de Filtros -->
        <section class="px-3 py-2 bg-white border-b border-slate-100 flex items-center justify-between text-xs shrink-0">
            <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                <button type="button" id="filter-all" class="filter-btn px-2.5 py-1 rounded-lg font-semibold text-indigo-700 bg-white shadow-xs">Todos</button>
                <button type="button" id="filter-pending" class="filter-btn px-2.5 py-1 rounded-lg font-medium text-slate-500">Falta</button>
                <button type="button" id="filter-completed" class="filter-btn px-2.5 py-1 rounded-lg font-medium text-slate-500">Feito</button>
            </div>
            
            <button type="button" id="clear-completed-btn" class="text-rose-500 hover:text-rose-700 font-semibold px-2 py-1 rounded-lg hover:bg-rose-50 transition flex items-center gap-1">
                <i class="fa-regular fa-trash-can text-xs"></i> Limpar
            </button>
        </section>

        <!-- Lista de Artigos -->
        <main class="flex-1 p-3 sm:p-4 overflow-y-auto custom-scrollbar bg-slate-50/30">
            <ul id="shopping-list" class="space-y-2">
                <!-- Itens inseridos dinamicamente -->
            </ul>

            <!-- Estado Vazio -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center text-slate-400">
                <div class="w-12 h-12 bg-indigo-50
